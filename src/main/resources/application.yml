spring:
  application:
    name: finly
  profiles:
    active: local

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-ms: ${JWT_ACCESS_TOKEN_EXPIRE_MS}
  refresh-token-expire-ms: ${JWT_REFRESH_TOKEN_EXPIRE_MS}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

kis:
  info:
    kospi-url: ${KIS_KOSPI_URL:}
    kosdaq-url: ${KIS_KOSDAQ_URL:}

tradingview:
  symbol-base-url: ${TRADINGVIEW_SYMBOL_URL:}
  s3-logo-base-url: ${TRADINGVIEW_S3_LOGO_URL:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  timeout-seconds: 60

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  cookie:
    secure: false
    same-site: Lax
    path: /auth
