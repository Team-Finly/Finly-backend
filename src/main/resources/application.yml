spring:
  application:
    name: finly

jwt:
  secret: ${JWT_SECRET:default-test-secret-key-for-development-only-32chars}
  access-token-expire-ms: ${JWT_ACCESS_TOKEN_EXPIRE_MS:3600000}
  refresh-token-expire-ms: ${JWT_REFRESH_TOKEN_EXPIRE_MS:1209600000}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

kis:
  info:
    kospi-url: ${KIS_KOSPI_URL:}
    kosdaq-url: ${KIS_KOSDAQ_URL:}

tradingview:
  symbol-base-url: ${TRADINGVIEW_SYMBOL_URL:}
  s3-logo-base-url: ${TRADINGVIEW_S3_LOGO_URL:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  timeout-seconds: 60