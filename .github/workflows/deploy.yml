name: Finly CI/CD (EC2 docker compose build)

on:
  push:
    branches: [ "develop" ]

concurrency:
  group: finly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build JAR (skip tests)
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 배포에 필요한 파일만 EC2로 업로드 (전체 소스도 필요하므로 .git 제외하고 올림)
      - name: Upload project to EC2 (exclude .git)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".,!**/.git/**"
          target: ${{ secrets.EC2_PATH || '/home/ubuntu/Finly-backend' }}
          overwrite: true

      - name: SSH deploy (docker compose up --build)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.EC2_PATH || '/home/ubuntu/Finly-backend' }}

            # .env 없으면 중단 
            if [ ! -f .env ]; then
              echo "❌ .env 파일이 없어 배포 중단"
              exit 1
            fi

            # docker compose 플러그인 기준
            docker compose down --remove-orphans || true

            # build 포함 재기동 
            docker compose up -d --build backend

            docker ps
            docker logs --tail=80 finly-backend || true
